[main]
shell=bash
font=DroidSansM Nerd Font Mono:size=12
font-bold=DejaVuSansM Nerd Font Mono:size=12:weight=bold
font-italic=DejaVuSansM Nerd Font Mono:size=12:slant=italic
font-bold-italic=DejaVuSansM Nerd Font Mono:size=12:weight=bold:slant=italic
pad=0x0 center
resize-by-cells=no

[key-bindings]
unicode-input=none
spawn-terminal=Control+T
scrollback-up-half-page=Control+U
scrollback-down-half-page=Control+D
scrollback-end=Control+Shift+space

[bell]
system=no

[cursor]
